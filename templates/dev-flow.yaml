name: dev-flow
description: Design -> human approval -> implement -> review (loops back on failure).
defaults:
  model: anthropic/claude-sonnet-4-5
steps:
  - id: design
    model: anthropic/claude-opus-4-5
    prompt: |
      Write a concise design for the following task. Do not write code.
      Task: {{input}}
  - id: accept
    gate: human
    show: design
    reviseTo: design
  - id: implement
    model: openai/gpt-5
    tools: [read, edit, write, bash]
    prompt: |
      Implement this design in the current project:
      {{design}}
  - id: review
    prompt: |
      Review the changes made against this design and run the tests.
      Design: {{design}}
    output: { verdict: "pass|fail", notes: "string" }
    on: { when: "review.verdict == fail", goto: implement, max: 2 }
